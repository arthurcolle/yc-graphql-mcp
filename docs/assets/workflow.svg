<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="500" viewBox="0 0 1440 500" role="img" aria-labelledby="title desc">
<title id="title">Read. Review. Commit. Verify.</title>
<desc id="desc">An MCP client reads the YC API directly. Changes require an exact preview, a durable receipt before dispatch, and a read-back afterward. Session credentials stay in private local storage.</desc>
<defs>
  <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe2c2"/><stop offset=".48" stop-color="#e2a674"/><stop offset="1" stop-color="#905939"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e2a674" stroke-opacity=".055"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#e2a674" stroke-width="1.4"/></marker>
</defs>
<rect width="1440" height="500" rx="18" fill="#0b0e13"/>
<rect width="1440" height="500" rx="18" fill="url(#grid)"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
<text x="48" y="53" fill="#e2a674" font-size="13" letter-spacing="3">THE WORKFLOW / YC GRAPHQL MCP</text>
<text x="1392" y="53" text-anchor="end" fill="#83868b" font-size="12">DIRECT HTTP · LOCAL STATE</text>
</g>
<g fill="#11151b" stroke="#39312b"><rect x="48" y="98" width="300" height="246" rx="12"/><rect x="396" y="98" width="300" height="246" rx="12"/><rect x="744" y="98" width="300" height="246" rx="12"/><rect x="1092" y="98" width="300" height="246" rx="12"/></g>
<g fill="none" stroke="#e2a674" stroke-width="2" marker-end="url(#arrow)"><path d="M354 222h34"/><path d="M702 222h34"/><path d="M1050 222h34"/></g>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#e2a674" font-size="14"><text x="74" y="136">01 / READ</text><text x="422" y="136">02 / REVIEW</text><text x="770" y="136">03 / COMMIT</text><text x="1118" y="136">04 / VERIFY</text></g>
<g font-family="Arial, Helvetica, sans-serif" fill="#f4efe7" font-size="28" font-weight="700"><text x="74" y="194">Start with facts.</text><text x="422" y="194">See the delta.</text><text x="770" y="194">Send it once.</text><text x="1118" y="194">Check the save.</text></g>
<g font-family="Arial, Helvetica, sans-serif" fill="#a8aaa9" font-size="17">
<text x="74" y="238">Fetch current answers</text><text x="74" y="263">and application status.</text>
<text x="422" y="238">Review exact fields,</text><text x="422" y="263">variables and target.</text>
<text x="770" y="238">Flush a durable receipt</text><text x="770" y="263">before API dispatch.</text>
<text x="1118" y="238">Read back changed fields.</text><text x="1118" y="263">Confirm what persisted.</text>
</g>
<g stroke="url(#copper)" stroke-width="3" stroke-linecap="round"><path d="M74 310h44"/><path d="M422 310h44"/><path d="M770 310h44"/><path d="M1118 310h44"/></g>
<path d="M48 386h1344" stroke="#2d2824"/>
<g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13"><text x="48" y="429" fill="#e2a674">PRIVATE AUTH</text><text x="48" y="454" fill="#92969a">Credentials stay on your machine.</text><text x="516" y="429" fill="#e2a674">EXPLICIT CHANGES</text><text x="516" y="454" fill="#92969a">Mutations are disabled by default.</text><text x="1000" y="429" fill="#e2a674">NO BLIND RETRIES</text><text x="1000" y="454" fill="#92969a">Uncertain means read back first.</text></g>
</svg>
